# VBWR E

name: release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh -NoProfile -File {0}

jobs:
  version:
    name: Verify release source
    runs-on: windows-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Match the version and require a main commit
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Releases must come from a commit reachable from main.' }
          $version = (Get-Content WorkTrail/build-version.json -Raw | ConvertFrom-Json).semVer
          if ($version -cnotmatch '^[1-9][0-9]{0,4}\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$' -or
              @($version.Split('.') | Where-Object { [int]$_ -gt 65534 }).Count -gt 0) {
            throw 'Version must be X.Y.Z with major 1..65534 and minor/patch 0..65534.'
          }
          if ($env:EVENT_NAME -eq 'push' -and ($env:REF_TYPE -ne 'tag' -or $env:REF_NAME -cne "v$version")) {
            throw 'The tag must exactly match the release version, such as v1.2.3.'
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:REF_NAME -ne 'main') {
            throw 'Run manual packaging rehearsals from main.'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

  package:
    name: portable (${{ matrix.platform }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.value }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test portable release safeguards
        if: matrix.platform == 'x64'
        run: |
          ./scripts/Test-PortableReleasePackaging.ps1

      - name: Publish portable application with bundled runtimes
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/WorkTrail.ps1 -Action PublishUnpackaged -Platform $env:RELEASE_PLATFORM -ReleaseVersion $env:RELEASE_VERSION -PublishOutputPath "./artifacts/portable-publish/$env:RELEASE_PLATFORM"
          ./scripts/New-PortableReleaseArchive.ps1 -PublishDirectory "./artifacts/portable-publish/$env:RELEASE_PLATFORM" -Version $env:RELEASE_VERSION -Platform $env:RELEASE_PLATFORM

      - name: Upload portable release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WorkTrail-${{ needs.version.outputs.value }}-${{ matrix.platform }}-portable-unsigned
          path: |
            artifacts/releases/${{ needs.version.outputs.value }}/${{ matrix.platform }}/**/*.zip
            artifacts/releases/${{ needs.version.outputs.value }}/${{ matrix.platform }}/**/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  draft:
    name: Draft portable release (awaiting review)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, package]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download both portable architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: WorkTrail-${{ needs.version.outputs.value }}-*-unsigned
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create a draft only
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @()
          foreach ($platform in @('x64', 'ARM64')) {
            $file = "WorkTrail-$env:RELEASE_VERSION-${platform}-portable-unsigned.zip"
            $matches = @(Get-ChildItem -LiteralPath 'release-assets' -Recurse -File -Filter $file)
            if ($matches.Count -ne 1) { throw "Missing or ambiguous release archive: $file" }
            $path = $matches[0].FullName
            $checksum = "$path.sha256"
            $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($expected -cne "$actual  $file") { throw "Archive checksum mismatch: $file" }
            $assets += @($path, $checksum)
          }
          $existing = gh release list --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          if (@($existing | Where-Object tagName -CEQ $env:RELEASE_TAG).Count -gt 0) {
            throw 'A release already exists for this tag. Review it manually; existing assets are never replaced.'
          }
          @"
          Portable ZIP preparation build for WorkTrail $env:RELEASE_VERSION (x64 and ARM64).

          Portable ZIPs can be extracted and run through WorkTrail.exe and include .NET and Windows App SDK.
          Application data remains in LocalAppData.
          On-device screenshot OCR requires the MSIX edition and is unavailable in the portable build.
          Every ZIP includes payload checksums and an adjacent archive checksum.
          Clean-machine portable-launch checks remain required before public publication.
          Microsoft Store MSIX packages are built and signed locally, outside this workflow.
          This draft is created automatically; the workflow never publishes it.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "WorkTrail $env:RELEASE_VERSION - portable ZIPs" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
