name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify source license headers
        shell: pwsh
        run: .\scripts\Test-SourceLicenseHeaders.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify code formatting
        shell: pwsh -NoProfile -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Format-Code.ps1 -Verify

      - name: Verify automatic formatting hook
        shell: pwsh -NoProfile -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-FormattingHooks.ps1

      - name: Restore and audit NuGet dependencies
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object {
            dotnet restore $_.FullName -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Test with code analyzers
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.Tests.csproj | ForEach-Object {
            dotnet test $_.FullName -p:Platform=x64 --no-restore -p:EnableNETAnalyzers=true -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory "artifacts/test-results/analyzers/$($_.BaseName)"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  build:
    name: release build (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore Release solution
        run: dotnet restore .\WorkTrail.slnx -p:Configuration=Release-Unpackaged -p:Platform=${{ matrix.platform }}

      - name: Build Release solution
        run: dotnet build .\WorkTrail.slnx --configuration Release-Unpackaged -p:Platform=${{ matrix.platform }} --no-restore -p:ContinuousIntegrationBuild=true -p:EnableNETAnalyzers=true -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true

      - name: Test Release solution
        if: matrix.platform == 'x64'
        run: dotnet test .\WorkTrail.slnx --configuration Release-Unpackaged -p:Platform=x64 --no-build --no-restore -m:1 --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory artifacts/test-results/release
