name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}\artifacts\ci\nuget
  UseArtifactsOutput: 'true'
  ArtifactsPath: ${{ github.workspace }}\artifacts\ci\build

jobs:
  lint:
    name: lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify source license headers
        shell: pwsh
        run: .\scripts\Test-SourceLicenseHeaders.ps1

      - name: Stage and scan official .NET SDK archive
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Initialize-CiDotNet.ps1

      - name: Scan .NET toolchain
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Test-DependencySecurity.ps1 -Stage DotNet -OutputDirectory artifacts/ci/security

      - name: Verify code formatting
        shell: pwsh -NoProfile -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Format-Code.ps1 -Verify

      - name: Verify automatic formatting hook
        shell: pwsh -NoProfile -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-FormattingHooks.ps1

      - name: Restore and audit NuGet dependencies
        shell: pwsh
        run: |
          git ls-files -- '*.csproj' | ForEach-Object {
            dotnet restore $_ -p:Platform=x64 -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Scan restored packages and extracted dependencies
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Test-DependencySecurity.ps1 -Stage NuGet -OutputDirectory artifacts/ci/security

      - name: Test with code analyzers
        shell: pwsh
        run: |
          git ls-files -- '*.Tests.csproj' | ForEach-Object {
            dotnet test $_ -p:Platform=x64 --no-restore -p:EnableNETAnalyzers=true -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory "artifacts/ci/test-results/analyzers/$([IO.Path]::GetFileNameWithoutExtension($_))"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Clean CI output
        if: always()
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Clear-CiOutput.ps1 -Configuration Debug -Platform x64

  build:
    name: release build (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage and scan official .NET SDK archive
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Initialize-CiDotNet.ps1

      - name: Scan .NET toolchain
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Test-DependencySecurity.ps1 -Stage DotNet -OutputDirectory artifacts/ci/security

      - name: Restore Release solution
        run: dotnet restore .\WorkTrail.slnx -p:Configuration=Release-Unpackaged -p:Platform=${{ matrix.platform }}

      - name: Scan restored packages and extracted dependencies
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Test-DependencySecurity.ps1 -Stage NuGet -OutputDirectory artifacts/ci/security

      - name: Build Release solution
        run: dotnet build .\WorkTrail.slnx --configuration Release-Unpackaged -p:Platform=${{ matrix.platform }} --no-restore -p:ContinuousIntegrationBuild=true -p:EnableNETAnalyzers=true -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true

      - name: Test Release solution
        if: matrix.platform == 'x64'
        run: dotnet test .\WorkTrail.slnx --configuration Release-Unpackaged -p:Platform=x64 --no-build --no-restore -m:1 --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory artifacts/ci/test-results/release

      - name: Clean CI output
        if: always()
        shell: pwsh -NoProfile -File {0}
        run: ./scripts/Clear-CiOutput.ps1 -Configuration Release-Unpackaged -Platform ${{ matrix.platform }}
